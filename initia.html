<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Initia Art</title>

<style>
body{
font-family:sans-serif;
background:#fff0f6;
padding:2rem;
}

/* header */
h1{margin-bottom:0.5rem;}
a{display:inline-block;margin-bottom:2rem;color:#c084fc;text-decoration:none;}

/* grid */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:12px;
}

.img-wrap{
width:100%;
height:160px;
overflow:hidden;
border-radius:12px;
cursor:pointer;
}

.img-wrap img{
width:100%;
height:100%;
object-fit:cover;
transition:.4s;
}

.img-wrap:hover img{
transform:scale(1.08);
}

/* LIGHTBOX */
.lightbox{
display:none;
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
justify-content:center;
align-items:center;
z-index:999;
}

.lightbox img{
max-width:90%;
max-height:90%;
object-fit:contain;
border-radius:12px;
transition:.3s;
}

/* arrows */
.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:2rem;
color:white;
cursor:pointer;
padding:10px;
user-select:none;
}

.left{left:20px;}
.right{right:20px;}

</style>
</head>

<body>

<h1>Initia ✨</h1>
<a href="gallery.html">← back</a>

<div class="grid">

<div class="img-wrap" onclick="openLightbox(0)">
<img src="images/initia/art1ok.png">
</div>

<div class="img-wrap" onclick="openLightbox(1)">
<img src="images/initia/art2ok.png">
</div>

<div class="img-wrap" onclick="openLightbox(2)">
<img src="images/initia/art3ok.png">
</div>

<div class="img-wrap" onclick="openLightbox(3)">
<img src="images/initia/art4ok.png">
</div>

<div class="img-wrap" onclick="openLightbox(4)">
<img src="images/initia/art5ok.png">
</div>

<div class="img-wrap" onclick="openLightbox(5)">
<img src="images/initia/art6ok.png">
</div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
<div class="arrow left" onclick="prev()">❮</div>
<img id="lightbox-img">
<div class="arrow right" onclick="next()">❯</div>
</div>

<script>
const images = [
"images/initia/art1ok.png",
"images/initia/art2ok.png",
"images/initia/art3ok.png",
"images/initia/art4ok.png",
"images/initia/art5ok.png",
"images/initia/art6ok.png"
];

let current = 0;

/* open */
function openLightbox(index){
current = index;
document.getElementById("lightbox").style.display="flex";
showImage();
}

/* show */
function showImage(){
document.getElementById("lightbox-img").src = images[current];
}

/* next prev */
function next(){
current = (current + 1) % images.length;
showImage();
}

function prev(){
current = (current - 1 + images.length) % images.length;
showImage();
}

/* close */
document.getElementById("lightbox").onclick = (e)=>{
if(e.target.id === "lightbox"){
document.getElementById("lightbox").style.display="none";
}
};

/* keyboard */
document.addEventListener("keydown",(e)=>{
if(document.getElementById("lightbox").style.display==="flex"){
if(e.key==="ArrowRight") next();
if(e.key==="ArrowLeft") prev();
if(e.key==="Escape") document.getElementById("lightbox").style.display="none";
}
});

/* SWIPE (mobile) */
let startX = 0;

const lightbox = document.getElementById("lightbox");

lightbox.addEventListener("touchstart",(e)=>{
startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend",(e)=>{
let endX = e.changedTouches[0].clientX;

if(startX - endX > 50){
next(); // swipe left
}
else if(endX - startX > 50){
prev(); // swipe right
}
});
</script>

</body>
</html>
