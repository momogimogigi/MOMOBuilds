<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Initia Art</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>

/* ===== THEME (SAMA DENGAN INDEX) ===== */
:root{
--bg:#fff0f6;
--bg2:#f9f5ff;
--card:#ffffff;
--accent:#c084fc;
--pink:#ffb3d9;
--text:#5b4b66;
--text2:#9c8aa5;
--font:'Quicksand', sans-serif;
}

body.dark{
--bg:#0b0b0f;
--bg2:#14141a;
--card:#111114;
--text:#f3f3f3;
--text2:#a1a1aa;
--accent:#c084fc;
}

body{
margin:0;
font-family:var(--font);
background:linear-gradient(135deg,var(--bg),var(--bg2));
color:var(--text);
transition:.4s;
padding:2rem;
overflow-x:hidden;
}

/* ===== NAV ===== */
.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:1.5rem;
}

h1{
font-size:1.8rem;
margin:0;
}

a.back{
color:var(--accent);
text-decoration:none;
font-family:'Space Mono', monospace;
font-size:.85rem;
}

/* toggle */
#toggle{
border:none;
background:var(--card);
color:var(--text);
padding:6px 10px;
border-radius:999px;
cursor:pointer;
}

/* ===== GRID ===== */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:12px;
margin-top:1.5rem;
}

/* ===== IMAGE CARD ===== */
.img-wrap{
width:100%;
height:160px;
overflow:hidden;
border-radius:14px;
cursor:pointer;
background:var(--card);
box-shadow:0 10px 20px rgba(0,0,0,0.05);
}

.img-wrap img{
width:100%;
height:100%;
object-fit:cover;
transition:.35s;
}

.img-wrap:hover img{
transform:scale(1.08);
}

/* ===== LIGHTBOX ===== */
.lightbox{
display:none;
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.92);
justify-content:center;
align-items:center;
z-index:999;
}

.lightbox img{
max-width:90%;
max-height:90%;
object-fit:contain;
border-radius:12px;
}

/* arrows */
.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:2rem;
color:white;
cursor:pointer;
user-select:none;
padding:10px;
}

.left{left:20px;}
.right{right:20px;}

</style>
</head>

<body>

<div class="topbar">
<h1>Initia ✨</h1>

<div style="display:flex;gap:10px;align-items:center;">
<a class="back" href="gallery.html">← back</a>
<button id="toggle">🌙</button>
</div>
</div>

<div class="grid">

<div class="img-wrap" onclick="openLightbox(0)">
<img src="images/initia/art1ok.png">
</div>

<div class="img-wrap" onclick="openLightbox(1)">
<img src="images/initia/art2ok.png">
</div>

<div class="img-wrap" onclick="openLightbox(2)">
<img src="images/initia/art3ok.png">
</div>

<div class="img-wrap" onclick="openLightbox(3)">
<img src="images/initia/art4ok.png">
</div>

<div class="img-wrap" onclick="openLightbox(4)">
<img src="images/initia/art5ok.png">
</div>

<div class="img-wrap" onclick="openLightbox(5)">
<img src="images/initia/art6ok.png">
</div>

</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
<div class="arrow left" onclick="prev()">❮</div>
<img id="lightbox-img">
<div class="arrow right" onclick="next()">❯</div>
</div>

<script>

/* ===== DARK MODE ===== */
const toggle = document.getElementById("toggle");

toggle.onclick = () => {
document.body.classList.toggle("dark");
toggle.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
};

/* ===== IMAGE DATA ===== */
const images = [
"images/initia/art1ok.png",
"images/initia/art2ok.png",
"images/initia/art3ok.png",
"images/initia/art4ok.png",
"images/initia/art5ok.png",
"images/initia/art6ok.png"
];

let current = 0;

/* OPEN */
function openLightbox(index){
current = index;
document.getElementById("lightbox").style.display="flex";
show();
}

/* SHOW */
function show(){
document.getElementById("lightbox-img").src = images[current];
}

/* NEXT / PREV */
function next(){
current = (current + 1) % images.length;
show();
}

function prev(){
current = (current - 1 + images.length) % images.length;
show();
}

/* CLOSE */
document.getElementById("lightbox").onclick = (e)=>{
if(e.target.id === "lightbox"){
document.getElementById("lightbox").style.display="none";
}
};

/* KEYBOARD */
document.addEventListener("keydown",(e)=>{
if(document.getElementById("lightbox").style.display==="flex"){
if(e.key==="ArrowRight") next();
if(e.key==="ArrowLeft") prev();
if(e.key==="Escape") document.getElementById("lightbox").style.display="none";
}
});

/* SWIPE */
let startX = 0;

const lightbox = document.getElementById("lightbox");

lightbox.addEventListener("touchstart",(e)=>{
startX = e.touches[0].clientX;
});

lightbox.addEventListener("touchend",(e)=>{
let endX = e.changedTouches[0].clientX;

if(startX - endX > 50){
next();
} else if(endX - startX > 50){
prev();
}
});

</script>

</body>
</html>
