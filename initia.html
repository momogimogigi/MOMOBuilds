<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Initia Art</title>

<style>
body{
font-family:sans-serif;
background:#fff0f6;
padding:2rem;
}

/* header */
h1{
margin-bottom:0.5rem;
}

a{
display:inline-block;
margin-bottom:2rem;
color:#c084fc;
text-decoration:none;
}

/* grid */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:12px;
}

/* image */
img{
width:100%;
height:160px; /* 🔥 penting biar ringan */
object-fit:cover;
border-radius:12px;
cursor:pointer;

filter:blur(10px);
transform:scale(1.05);
transition:.4s;
}

/* setelah load */
img.loaded{
filter:blur(0);
transform:scale(1);
}

/* hover */
img:hover{
transform:scale(1.05);
}

/* LIGHTBOX */
.lightbox{
display:none;
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.92);
justify-content:center;
align-items:center;
z-index:999;
animation:fadeIn .3s ease;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:12px;
animation:zoomIn .3s ease;
}

/* animasi */
@keyframes fadeIn{
from{opacity:0;}
to{opacity:1;}
}

@keyframes zoomIn{
from{transform:scale(.8);}
to{transform:scale(1);}
}

</style>
</head>

<body>

<h1>Initia ✨</h1>
<a href="gallery.html">← back</a>

<div class="grid">

<img src="images/initia/art1ok.png" loading="lazy" onclick="openLightbox(this)">
<img src="images/initia/art2ok.png" loading="lazy" onclick="openLightbox(this)">
<img src="images/initia/art3ok.png" loading="lazy" onclick="openLightbox(this)">
<img src="images/initia/art4ok.png" loading="lazy" onclick="openLightbox(this)">
<img src="images/initia/art5ok.png" loading="lazy" onclick="openLightbox(this)">
<img src="images/initia/art6ok.png" loading="lazy" onclick="openLightbox(this)">

</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
<img id="lightbox-img">
</div>

<script>
// lightbox
function openLightbox(img){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=img.src;
}
function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}

// blur loading effect
document.querySelectorAll("img").forEach(img=>{
img.onload=()=> img.classList.add("loaded");
});
</script>

</body>
</html>
