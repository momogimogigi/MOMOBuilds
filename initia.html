<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Initia Art</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#fff0f6;
--bg2:#f9f5ff;
--card:#fff;
--accent:#c084fc;
--text:#5b4b66;
}

body.dark{
--bg:#0b0b0f;
--bg2:#14141a;
--card:#111114;
--text:#f3f3f3;
}

body{
margin:0;
font-family:'Quicksand';
background:linear-gradient(135deg,var(--bg),var(--bg2));
color:var(--text);
padding:2rem;
transition:.4s;
}

.topbar{
display:flex;
justify-content:space-between;
max-width:900px;
margin:auto;
align-items:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:12px;
max-width:900px;
margin:auto;
}

.img-wrap{
height:160px;
overflow:hidden;
border-radius:12px;
cursor:pointer;
background:var(--card);
}

.img-wrap img{
width:100%;
height:100%;
object-fit:cover;
}

.toggle{
border:none;
background:var(--card);
padding:6px 10px;
border-radius:999px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
<h1>Initia ✨</h1>
<div>
<a href="gallery.html">← back</a>
<button id="toggle">🌙</button>
</div>
</div>

<div class="grid">
<script>
const grid=document.currentScript.parentElement;

const images=[
"images/initia/art1ok.png",
"images/initia/art2ok.png",
"images/initia/art3ok.png",
"images/initia/art4ok.png",
"images/initia/art5ok.png",
"images/initia/art6ok.png"
];

images.forEach((src,i)=>{
grid.innerHTML+=`
<div class="img-wrap" onclick="openL(${i})">
<img src="${src}">
</div>`;
});
</script>
</div>

<script>
const toggle=document.getElementById("toggle");

function applyTheme(){
const t=localStorage.getItem("theme");
document.body.classList.toggle("dark",t==="dark");
toggle.textContent=t==="dark"?"☀️":"🌙";
}
applyTheme();

toggle.onclick=()=>{
const isDark=document.body.classList.toggle("dark");
localStorage.setItem("theme",isDark?"dark":"light");
toggle.textContent=isDark?"☀️":"🌙";
};

window.addEventListener("storage",applyTheme);
</script>

</body>
</html>
