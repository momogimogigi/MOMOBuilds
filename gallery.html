<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMO Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
:root{
--bg:#fff0f6;
--bg2:#f9f5ff;
--card:#fff;
--accent:#c084fc;
--text:#5b4b66;
--text2:#9c8aa5;
}

body.dark{
--bg:#0b0b0f;
--bg2:#14141a;
--card:#111114;
--text:#f3f3f3;
--text2:#a1a1aa;
}

body{
margin:0;
font-family:'Quicksand';
background:linear-gradient(135deg,var(--bg),var(--bg2));
color:var(--text);
transition:.4s;
text-align:center;
padding:3rem 1.5rem;
}

.topbar{
display:flex;
justify-content:space-between;
max-width:700px;
margin:auto;
align-items:center;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:1.5rem;
max-width:700px;
margin:auto;
}

.folder{
background:var(--card);
padding:2rem;
border-radius:20px;
text-decoration:none;
color:var(--text);
transition:.3s;
}

.folder:hover{transform:translateY(-6px);}

.toggle{
border:none;
background:var(--card);
padding:8px 12px;
border-radius:999px;
cursor:pointer;
}
</style>
</head>

<body>

<div class="topbar">
<h1>MOMO Gallery ✨</h1>
<button class="toggle" id="toggle">🌙</button>
</div>

<div class="grid">

<a href="initia.html" class="folder">Initia</a>
<a href="rise.html" class="folder">Rise Chain</a>

</div>

<script>
const toggle=document.getElementById("toggle");

function applyTheme(){
const t=localStorage.getItem("theme");
if(t==="dark"){
document.body.classList.add("dark");
toggle.textContent="☀️";
}else{
document.body.classList.remove("dark");
toggle.textContent="🌙";
}
}
applyTheme();

toggle.onclick=()=>{
const isDark=document.body.classList.toggle("dark");
localStorage.setItem("theme",isDark?"dark":"light");
toggle.textContent=isDark?"☀️":"🌙";
};

window.addEventListener("storage",applyTheme);
</script>

</body>
</html>
