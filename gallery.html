<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMO Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
body{
font-family:'Quicksand',sans-serif;
background:#fff0f6;
color:#5b4b66;
padding:2rem;
}

/* header */
.header{
display:flex;
justify-content:space-between;
margin-bottom:2rem;
}

a{
text-decoration:none;
color:#c084fc;
}

/* section */
.section{
margin-bottom:3rem;
}

h2{
margin-bottom:1rem;
}

/* grid */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:12px;
}

.grid img{
width:100%;
height:180px;
object-fit:cover;
border-radius:12px;
cursor:pointer;
transition:.3s;
}

.grid img:hover{
transform:scale(1.05);
}

/* LIGHTBOX */
.lightbox{
display:none;
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
}

.lightbox img{
max-width:90%;
max-height:90%;
border-radius:12px;
}
</style>
</head>

<body>

<div class="header">
<h1>MOMO Gallery ✨</h1>
<a href="index.html">← back</a>
</div>

<!-- INITIA -->
<div class="section">
<h2>Initia</h2>
<div class="grid">
<img src="images/initia/art1.png" onclick="openLightbox(this)">
<img src="images/initia/art2.png" onclick="openLightbox(this)">
</div>
</div>

<!-- RISE -->
<div class="section">
<h2>Rise Chain</h2>
<div class="grid">
<img src="images/rise/art1.png" onclick="openLightbox(this)">
<img src="images/rise/art2.png" onclick="openLightbox(this)">
</div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox" onclick="closeLightbox()">
<img id="lightbox-img">
</div>

<script>
function openLightbox(img){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=img.src;
}

function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}
</script>

</body>
</html>
