<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMO Gallery</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>

/* ===== THEME (SAMA DENGAN INDEX) ===== */
:root{
--bg:#fff0f6;
--bg2:#f9f5ff;
--card:#ffffff;
--accent:#c084fc;
--pink:#ffb3d9;
--text:#5b4b66;
--text2:#9c8aa5;
--font:'Quicksand',sans-serif;
}

body.dark{
--bg:#0b0b0f;
--bg2:#14141a;
--card:#111114;
--text:#f3f3f3;
--text2:#a1a1aa;
}

body{
margin:0;
font-family:var(--font);
background:linear-gradient(135deg,var(--bg),var(--bg2));
color:var(--text);
transition:.4s;
text-align:center;
padding:3rem 1.5rem;
}

/* ===== HEADER ===== */
h1{
margin-bottom:2.5rem;
font-size:2.2rem;
letter-spacing:-0.02em;
}

/* ===== GRID ===== */
.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:1.5rem;
max-width:700px;
margin:auto;
}

/* ===== FOLDER CARD ===== */
.folder{
background:var(--card);
border-radius:22px;
padding:2rem 1.5rem;
transition:.35s;
cursor:pointer;
text-decoration:none;
color:var(--text);
position:relative;
overflow:hidden;
border:1px solid rgba(0,0,0,0.04);
}

/* hover soft lift */
.folder:hover{
transform:translateY(-8px);
box-shadow:0 20px 40px rgba(0,0,0,0.08);
}

/* glow effect */
.folder::before{
content:"";
position:absolute;
top:-50%;
left:-50%;
width:200%;
height:200%;
background:radial-gradient(circle, rgba(192,132,252,0.15), transparent 60%);
opacity:0;
transition:.4s;
}

.folder:hover::before{
opacity:1;
}

/* icon */
.folder img{
width:70px;
margin-bottom:1rem;
transition:.3s;
}

.folder:hover img{
transform:scale(1.1);
}

/* text */
.folder h3{
margin-bottom:.3rem;
font-size:1.1rem;
}

.folder p{
font-size:.8rem;
color:var(--text2);
font-family:'Space Mono', monospace;
}

/* ===== BACK LINK ===== */
.back{
display:inline-block;
margin-top:2.5rem;
color:var(--accent);
text-decoration:none;
font-size:.9rem;
}

/* ===== DARK MODE BUTTON (optional future) ===== */
</style>
</head>

<body>

<h1>MOMO Gallery ✨</h1>

<div class="grid">

<a href="initia.html" class="folder">
<img src="images/folder/initia.png">
<h3>Initia</h3>
<p>visual contributions</p>
</a>

<a href="rise.html" class="folder">
<img src="images/folder/rise.jpg">
<h3>Rise Chain</h3>
<p>crypto artworks</p>
</a>

</div>

<a class="back" href="index.html">← back to home</a>

</body>
</html>
