<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMO Gallery</title>

<style>
body{
font-family:sans-serif;
background:#fff0f6;
text-align:center;
padding:3rem;
}

h1{margin-bottom:2rem;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:2rem;
max-width:600px;
margin:auto;
}

.folder{
background:white;
padding:2rem;
border-radius:20px;
transition:.3s;
text-decoration:none;
color:#5b4b66;
}

.folder:hover{
transform:translateY(-6px);
}

.folder img{
width:80px;
margin-bottom:1rem;
}

a{text-decoration:none;color:inherit;}
</style>
</head>

<body>

<h1>MOMO Gallery ✨</h1>

<div class="grid">

<a href="initia.html">
<div class="folder">
<img src="images/folder/initia.png">
<h3>Initia</h3>
</div>
</a>

<a href="rise.html">
<div class="folder">
<img src="images/folder/rise.png">
<h3>Rise Chain</h3>
</div>
</a>

</div>

<a href="index.html">← back</a>

</body>
</html>
