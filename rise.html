<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rise Art</title>

<style>
body{
font-family:sans-serif;
background:#fff0f6;
padding:2rem;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
gap:12px;
}

img{
width:100%;
border-radius:12px;
cursor:pointer;
}

.lightbox{
display:none;
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.9);
justify-content:center;
align-items:center;
}

.lightbox img{
max-width:90%;
max-height:90%;
}
</style>
</head>

<body>

<h1>Rise Chain ✨</h1>
<a href="gallery.html">← back</a>

<div class="grid">
<img src="images/rise/art1.png" onclick="openLightbox(this)">
<img src="images/rise/art2.png" onclick="openLightbox(this)">
</div>

<div id="lightbox" class="lightbox" onclick="closeLightbox()">
<img id="lightbox-img">
</div>

<script>
function openLightbox(img){
document.getElementById("lightbox").style.display="flex";
document.getElementById("lightbox-img").src=img.src;
}
function closeLightbox(){
document.getElementById("lightbox").style.display="none";
}
</script>

</body>
</html>
