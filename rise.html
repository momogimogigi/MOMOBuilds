<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rise Art</title>

<style>
body{
font-family:sans-serif;
background:#fff0f6;
padding:2rem;
margin:0;
}

h1{margin-bottom:0.5rem;}
a{display:inline-block;margin-bottom:2rem;color:#c084fc;text-decoration:none;}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:12px;
}

/* image container */
.img-wrap{
width:100%;
height:160px;
overflow:hidden;
border-radius:12px;
cursor:pointer;
background:#eee;
}

.img-wrap img{
width:100%;
height:100%;
object-fit:cover;
display:block;
transition:.3s;
}

.img-wrap:hover img{
transform:scale(1.06);
}

/* LIGHTBOX */
.lightbox{
display:none;
position:fixed;
top:0;left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.95);
justify-content:center;
align-items:center;
z-index:999;
}

.lightbox img{
max-width:92%;
max-height:90%;
object-fit:contain;
border-radius:12px;
}

/* arrows */
.arrow{
position:absolute;
top:50%;
transform:translateY(-50%);
font-size:2rem;
color:white;
cursor:pointer;
user-select:none;
padding:12px;
opacity:0.8;
}

.left{left:15px;}
.right{right:15px;}

</style>
</head>

<body>

<h1>Rise Chain ✨</h1>
<a href="gallery.html">← back</a>

<div class="grid" id="grid"></div>

<!-- LIGHTBOX -->
<div id="lightbox" class="lightbox">
<div class="arrow left" onclick="prev()">❮</div>
<img id="lightbox-img">
<div class="arrow right" onclick="next()">❯</div>
</div>

<script>

/* =========================
   IMAGES 1 - 49
========================= */
const images = Array.from({length:49}, (_,i)=>
`images/rise/art${i+1}.png`
);

/* =========================
   RENDER GRID AUTOMATIC
========================= */
const grid = document.getElementById("grid");

images.forEach((src, index)=>{
const div = document.createElement("div");
div.className = "img-wrap";
div.innerHTML = `<img src="${src}" onclick="openLightbox(${index})">`;
grid.appendChild(div);
});

/* =========================
   LIGHTBOX LOGIC
========================= */
let current = 0;

function openLightbox(index){
current = index;
document.getElementById("lightbox").style.display="flex";
show();
}

function show(){
document.getElementById("lightbox-img").src = images[current];
}

function next(){
current = (current + 1) % images.length;
show();
}

function prev(){
current = (current - 1 + images.length) % images.length;
show();
}

/* close when click outside image */
document.getElementById("lightbox").onclick = (e)=>{
if(e.target.id === "lightbox"){
document.getElementById("lightbox").style.display="none";
}
};

/* keyboard */
document.addEventListener("keydown",(e)=>{
if(document.getElementById("lightbox").style.display==="flex"){
if(e.key==="ArrowRight") next();
if(e.key==="ArrowLeft") prev();
if(e.key==="Escape") document.getElementById("lightbox").style.display="none";
}
});

/* swipe mobile */
let startX = 0;
const lb = document.getElementById("lightbox");

lb.addEventListener("touchstart",(e)=>{
startX = e.touches[0].clientX;
});

lb.addEventListener("touchend",(e)=>{
let endX = e.changedTouches[0].clientX;

if(startX - endX > 50){
next();
}
else if(endX - startX > 50){
prev();
}
});

</script>

</body>
</html>
