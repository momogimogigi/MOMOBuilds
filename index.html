<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMO — Crypto Space</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
--bg:#fff0f6;
--bg2:#f9f5ff;
--card:#ffffff;
--accent:#c084fc;
--pink:#ffb3d9;
--text:#5b4b66;
--text2:#9c8aa5;
}

body.dark{
--bg:#0b0b0f;
--bg2:#14141a;
--card:#111114;
--text:#f3f3f3;
--text2:#a1a1aa;
}

body{
font-family:'Quicksand',sans-serif;
background:linear-gradient(135deg,var(--bg),var(--bg2));
color:var(--text);
transition:.4s;
}

nav{
display:flex;
justify-content:space-between;
padding:1.5rem 2rem;
}

#toggle{
border:none;
background:var(--card);
border-radius:999px;
padding:6px 10px;
cursor:pointer;
}

.hero{
text-align:center;
padding:6rem 2rem;
}

.hero h1{font-size:clamp(3rem,8vw,5rem);}
.accent{color:var(--accent);}

.btn{
display:inline-block;
margin-top:2rem;
padding:.8rem 2rem;
background:var(--pink);
color:white;
border-radius:999px;
text-decoration:none;
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:1rem;
max-width:900px;
margin:3rem auto;
padding:0 2rem;
}

.card{
background:var(--card);
padding:1.5rem;
border-radius:20px;
transition:.3s;
}

.card:hover{transform:translateY(-6px);}

footer{
text-align:center;
padding:2rem;
color:var(--text2);
}
</style>
</head>

<body>

<nav>
<div>MOMO 💜</div>
<button id="toggle">🌙</button>
</nav>

<section class="hero">
<h1>MOMO<br><span class="accent">in crypto</span></h1>
<p>a soft space for building & contributing ✨</p>
<a href="#work" class="btn">explore →</a>
</section>

<section id="work">
<div class="grid">

<a href="gallery.html" style="text-decoration:none;color:inherit;">
<div class="card">
<h3>🎨 visual contributions</h3>
<p>click to explore my art</p>
</div>
</a>

<div class="card"><h3>💻 builds</h3><p>simple web experiments</p></div>
<div class="card"><h3>🧠 ideas</h3><p>UX thinking</p></div>
<div class="card"><h3>🌐 presence</h3><p>community contributions</p></div>

</div>
</section>

<footer>MOMO ✨</footer>

<script>
const toggle=document.getElementById("toggle");

function applyTheme(){
const theme=localStorage.getItem("theme");
if(theme==="dark"){
document.body.classList.add("dark");
toggle.textContent="☀️";
}else{
document.body.classList.remove("dark");
toggle.textContent="🌙";
}
}

applyTheme();

toggle.onclick=()=>{
const isDark=document.body.classList.toggle("dark");
localStorage.setItem("theme",isDark?"dark":"light");
toggle.textContent=isDark?"☀️":"🌙";
};

window.addEventListener("storage",applyTheme);
</script>

</body>
</html>
