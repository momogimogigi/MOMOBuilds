<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMO — Crypto Space</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;}

:root{
--bg:#fff0f6;
--bg2:#f9f5ff;
--card:#ffffff;
--accent:#c084fc;
--pink:#ffb3d9;
--text:#5b4b66;
--text2:#9c8aa5;
}

body.dark{
--bg:#0b0b0f;
--bg2:#14141a;
--card:#111114;
--text:#f3f3f3;
--text2:#a1a1aa;
}

body{
font-family:'Quicksand',sans-serif;
background:linear-gradient(135deg,var(--bg),var(--bg2));
color:var(--text);
transition:.4s;
overflow-x:hidden;
}

/* 🌸 floating blobs background */
.blob{
position:fixed;
width:300px;
height:300px;
background:radial-gradient(circle,var(--pink),transparent 70%);
filter:blur(40px);
opacity:.4;
z-index:-1;
animation:float 10s ease-in-out infinite;
}

.blob.one{top:-80px;left:-80px;}
.blob.two{bottom:-100px;right:-80px;animation-delay:3s;}
.blob.three{top:40%;left:60%;animation-delay:6s;}

@keyframes float{
0%,100%{transform:translateY(0) translateX(0);}
50%{transform:translateY(30px) translateX(20px);}
}

/* ✨ sparkles */
.sparkle{
position:fixed;
width:6px;
height:6px;
background:white;
border-radius:50%;
opacity:.6;
animation:twinkle 3s infinite ease-in-out;
z-index:-1;
}

@keyframes twinkle{
0%,100%{opacity:0;transform:scale(0.5);}
50%{opacity:1;transform:scale(1.2);}
}

nav{
display:flex;
justify-content:space-between;
padding:1.5rem 2rem;
}

#toggle{
border:none;
background:var(--card);
border-radius:999px;
padding:6px 10px;
cursor:pointer;
}

.hero{
text-align:center;
padding:6rem 2rem;
position:relative;
}

/* 💫 floating hero text */
.hero h1{
font-size:clamp(3rem,8vw,5rem);
animation:softBounce 4s ease-in-out infinite;
}

@keyframes softBounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

.accent{color:var(--accent);}

.hero p{
opacity:.8;
animation:fadeIn 2s ease forwards;
}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:.8;transform:translateY(0);}
}

.btn{
display:inline-block;
margin-top:2rem;
padding:.8rem 2rem;
background:var(--pink);
color:white;
border-radius:999px;
text-decoration:none;
transition:.3s;
}

.btn:hover{
transform:scale(1.05);
box-shadow:0 10px 20px rgba(0,0,0,.1);
}

.grid{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:1rem;
max-width:900px;
margin:3rem auto;
padding:0 2rem;
}

.card{
background:var(--card);
padding:1.5rem;
border-radius:20px;
transition:.3s;
position:relative;
overflow:hidden;
}

/* cute hover glow */
.card::before{
content:"";
position:absolute;
inset:0;
background:radial-gradient(circle at top left,var(--pink),transparent 60%);
opacity:0;
transition:.3s;
}

.card:hover::before{opacity:.2;}
.card:hover{transform:translateY(-6px) scale(1.02);}

footer{
text-align:center;
padding:2rem;
color:var(--text2);
}
</style>
</head>

<body>

<!-- 🌸 background blobs -->
<div class="blob one"></div>
<div class="blob two"></div>
<div class="blob three"></div>

<!-- ✨ sparkles -->
<div class="sparkle" style="top:20%;left:30%;"></div>
<div class="sparkle" style="top:60%;left:70%;animation-delay:1s;"></div>
<div class="sparkle" style="top:80%;left:20%;animation-delay:2s;"></div>

<nav>
<div>MOMO 💜</div>
<button id="toggle">🌙</button>
</nav>

<section class="hero">
<h1>MOMO<br><span class="accent">in crypto</span></h1>
<p>a soft space for building & contributing ✨</p>
<a href="#work" class="btn">explore →</a>
</section>

<section id="work">
<div class="grid">

<a href="gallery.html" style="text-decoration:none;color:inherit;">
<div class="card">
<h3>🎨 visual contributions</h3>
<p>click to explore my art</p>
</div>
</a>

  <a href="builds.html" style="text-decoration:none;color:inherit;">
<div class="card">
<h3>💻 builds</h3>
<p>simple web experiments</p>
</div>
</a>
<div class="card"><h3>🧠 ideas</h3><p>UX thinking</p></div>
<div class="card"><h3>🌐 presence</h3><p>community contributions</p></div>

</div>
</section>

<footer>MOMO ✨</footer>

<script>
const toggle=document.getElementById("toggle");

function applyTheme(){
const theme=localStorage.getItem("theme");
if(theme==="dark"){
document.body.classList.add("dark");
toggle.textContent="☀️";
}else{
document.body.classList.remove("dark");
toggle.textContent="🌙";
}
}

applyTheme();

toggle.onclick=()=>{
const isDark=document.body.classList.toggle("dark");
localStorage.setItem("theme",isDark?"dark":"light");
toggle.textContent=isDark?"☀️":"🌙";
};

window.addEventListener("storage",applyTheme);
</script>

</body>
</html>
